<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UPRACE OMEGA MÙA 6 - (BẢN TEST DÁN DỮ LIỆU)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- THƯ VIỆN SUPABASE REALTIME -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- THƯ VIỆN ĐỌC FILE EXCEL -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pangolin&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .font-banner { font-family: 'Fredoka', 'Pangolin', cursive, sans-serif; }
    .banner-title-white { text-shadow: 3px 3px 0 #1e3a8a, -3px -3px 0 #1e3a8a, 3px -3px 0 #1e3a8a, -3px 3px 0 #1e3a8a; }
    .banner-title-yellow { color: #facc15; text-shadow: 3px 3px 0 #1e3a8a, -3px -3px 0 #1e3a8a, 3px -3px 0 #1e3a8a, -3px 3px 0 #1e3a8a; }

    body.is-admin #sec-compare { order: 1; }
    body.is-admin #sec-paste { order: 2; }
    body.is-admin #sec-batch { order: 3; }
    body.is-admin #sec-history { order: 4; }
    body.is-admin #sec-team-board { order: 5; }
    body.is-admin #sec-indiv-board { order: 6; }

    body:not(.is-admin) #sec-compare { order: 1; }
    body:not(.is-admin) #sec-team-board { order: 2; }
    body:not(.is-admin) #sec-indiv-board { order: 3; }
    body:not(.is-admin) #sec-history { order: 4; }
  </style>
</head>
<body class="pb-12">

  <div class="bg-amber-500 text-slate-950 font-black text-center py-2 px-4 text-xs sm:text-sm tracking-wide shadow-md">
    ⚠️ TRANG BẢN SAO THỬ NGHIỆM DÁN DỮ LIỆU TỪ ẢNH CHỤP STRAVA
  </div>

  <header class="relative w-full overflow-hidden bg-gradient-to-b from-sky-400 via-cyan-300 to-blue-600 pt-8 pb-12 shadow-2xl border-b-4 border-cyan-400">
    <div class="max-w-5xl mx-auto px-4 relative z-10 flex flex-col md:flex-row items-center justify-between gap-6 text-center md:text-left">
      <div class="flex-1 flex flex-col items-center">
        <div class="relative bg-blue-700/90 border-4 border-blue-900 px-8 py-5 rounded-3xl shadow-2xl backdrop-blur-sm max-w-2xl w-full text-center">
          <h1 class="text-4xl sm:text-5xl font-black tracking-wider uppercase font-banner flex justify-center items-center gap-x-3">
            <span class="text-white banner-title-white">UPRACE</span>
            <span class="banner-title-yellow">OMEGA MÙA 6</span>
          </h1>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 mt-6 space-y-8 flex flex-col">

    <!-- THANH TRẠNG THÁI -->
    <div class="bg-slate-800/90 border border-slate-700 rounded-2xl p-3 flex justify-between items-center text-xs">
      <span id="admin-badge" class="bg-slate-700 text-slate-300 font-bold px-2.5 py-1 rounded-lg">👀 Chế độ: Người Xem</span>
      <button id="auth-btn" onclick="toggleAdminAuth()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-black px-3 py-1 rounded-lg shadow">🔑 Đăng Nhập Admin</button>
    </div>

    <!-- KHU VỰC DÁN CHỮ BÓC TÁCH TỪ ẢNH (CHỈ ADMIN THẤY) -->
    <section id="sec-paste" class="admin-only hidden bg-slate-800 border-2 border-emerald-500/50 rounded-2xl p-6 shadow-xl space-y-3">
      <div class="flex justify-between items-center">
        <h2 class="text-emerald-400 font-bold text-base flex items-center gap-2">
          📋 DÁN DỮ LIỆU ĐÃ BÓC TÁCH TỪ ẢNH STRAVA
        </h2>
        <span class="text-xs text-slate-400 italic">Dán văn bản dạng CSV do AI trả lời vào đây</span>
      </div>

      <div>
        <textarea id="paste-input" rows="5" placeholder="Dán đoạn chữ vào đây, ví dụ:
Danh Nguyễn,2026-10-08,Bơi,2397,2.38
Danh Nguyễn,2026-10-07,Bơi,1000,2.11" class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-xs font-mono text-amber-300 focus:outline-none focus:border-emerald-400"></textarea>
      </div>

      <div class="flex justify-end gap-3">
        <button onclick="clearPasteText()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold px-4 py-2 rounded-xl text-xs">Xóa văn bản</button>
        <button onclick="processPastedData()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-6 py-2 rounded-xl text-xs shadow-lg flex items-center gap-2">
          🚀 NẠP NGHỆCH TẬP LÊN WEB NGAY
        </button>
      </div>

      <div id="paste-log-output" class="hidden bg-slate-950 p-3 rounded-xl text-xs font-mono text-emerald-400 border border-slate-800 max-h-32 overflow-y-auto"></div>
    </section>

    <!-- BẢNG XẾP HẠNG VÀ TÍNH NĂNG KHÁC GIỮ NGUYÊN -->
  </main>

  <script>
    const SUPABASE_URL = 'https://zcsxvruunhdewuceahfm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpjc3h2cnV1bmhkZXd1Y2VhaGZtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4ODI3NjgsImV4cCI6MjEwNjQ1ODc2OH0.eXtey9Ow-IxpahCpol3VS9V0sdHyOBOAdVM-Ql2LuaY';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ADMIN_PIN = "123456";
    let isAdmin = false;

    const MEMBERS_MAP = {
      "Thanh Nhã": 1, "Huỳnh Tuấn": 1, "Tùng Trần": 1, "Nguyễn Quân": 1, "Lợi Cao": 1,
      "Lê Hà": 1, "Hà Trần": 1, "An Đào": 1, "Mỹ Linh": 1, "Văn Lê": 1,
      "Lê Lợi": 2, "Danh Nguyễn": 2, "Khánh Hòa": 2, "Lê Thương": 2, "Hưng Nguyễn": 2,
      "Vũ Hậu": 2, "Tùng Tiger": 2, "Quỳnh Anh": 2, "Bảo Việt": 2, "Trâm Lê": 2
    };

    function toggleAdminAuth() {
      const pin = prompt("🔑 Nhập PIN Admin:");
      if (pin === ADMIN_PIN) {
        isAdmin = true;
        document.querySelectorAll('.admin-only').forEach(el => el.classList.remove('hidden'));
        document.getElementById('admin-badge').innerText = "👑 Chế độ: ADMIN";
      }
    }

    function clearPasteText() {
      document.getElementById('paste-input').value = '';
      document.getElementById('paste-log-output').classList.add('hidden');
    }

    async function processPastedData() {
      const text = document.getElementById('paste-input').value.trim();
      const logOutput = document.getElementById('paste-log-output');

      if (!text) {
        alert("⚠️ Chị vui lòng dán đoạn văn bản dữ liệu vào khung trước nhé!");
        return;
      }

      logOutput.classList.remove('hidden');
      logOutput.innerText = "⏳ Đang phân tích văn bản và xử lý...";

      const lines = text.split('\n');
      const payloads = [];
      let successCount = 0;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith('Thành viên')) continue; // Bỏ qua tiêu đề

        const parts = line.split(',');
        if (parts.length < 5) continue;

        const memberName = parts[0].trim();
        const rawDate = parts[1].trim();
        const rawType = parts[2].trim().toLowerCase();
        const distance = parseFloat(parts[3]);
        const pace = parseFloat(parts[4]);

        const teamId = MEMBERS_MAP[memberName];
        if (!teamId) continue;

        const type = (rawType.includes('bơi') || rawType === 'swim') ? 'swim' : 'run';

        const start = new Date('2026-09-21');
        const current = new Date(rawDate);
        const diffDays = Math.floor((current - start) / (1000 * 60 * 60 * 24));
        const week = Math.min(8, Math.max(1, Math.floor(diffDays / 7) + 1));

        const isPaceValid = (type === 'swim' && pace <= 6.0) || (type === 'run' && pace <= 12.0);

        payloads.push({
          id: Date.now() + i,
          date: rawDate,
          team_id: teamId,
          member: memberName,
          type: type,
          distance: distance,
          pace: pace,
          week: week,
          is_suspicious: !isPaceValid,
          note: isPaceValid ? "Nạp từ ảnh Strava" : "Pace bất thường",
          is_approved: isPaceValid,
          created_at: new Date().toISOString()
        });

        successCount++;
      }

      if (payloads.length > 0) {
        logOutput.innerText = `⏳ Đang nạp ${payloads.length} bài tập lên Supabase...`;
        const { error } = await supabaseClient.from('tracks').upsert(payloads);
        if (error) {
          logOutput.innerText = `❌ Lỗi lưu Supabase: ${error.message}`;
        } else {
          logOutput.innerText = `✅ ĐÃ NẠP THÀNH CÔNG ${successCount} TRACKS NGHỆCH TẬP LÊN WEB!\nTrang web đã tự động cập nhật bảng xếp hạng.`;
        }
      } else {
        logOutput.innerText = "❌ Không tìm thấy dòng dữ liệu hợp lệ. Chị kiểm tra lại định dạng dán nhé!";
      }
    }
  </script>
</body>
</html>
